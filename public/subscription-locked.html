<!DOCTYPE html>
<html lang="en">
<head>
<!-- favicon:start -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#4A5AF0">
<!-- favicon:end -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Access paused — ElimuOs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/theme.css">
<style>
  .lockout-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .lockout-card{ max-width:440px; width:100%; text-align:center; background:white; border:1px solid var(--line); border-radius:var(--radius-lg); padding:40px 32px; }
  .lockout-icon{ width:64px; height:64px; border-radius:50%; background:rgba(232,162,61,0.15); color:#8A5B14; display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin:0 auto 18px; }
  .lockout-card h1{ font-size:1.25rem; margin-bottom:10px; }
  .lockout-card p{ color:var(--ink-soft); font-size:0.92rem; line-height:1.6; margin-bottom:26px; }
</style>
</head>
<body>

<div class="lockout-shell">
  <div class="lockout-card">
    <div class="brand" style="justify-content:center; margin-bottom:22px;">
      <span class="brand-mark"><img src="/assets/logo.png" alt="ElimuOs logo"></span>
      ElimuOs
    </div>
    <div class="lockout-icon"><i class="bi bi-hourglass-split"></i></div>
    <h1>Your school's access is paused</h1>
    <p id="lockoutMessage">Your school's ElimuOs subscription isn't currently active. Please contact your school administrator to renew it — you'll be able to sign back in as soon as it's sorted out.</p>
    <button class="btn-elimu btn-elimu-ghost btn-elimu-block" id="logoutBtn">Log out</button>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('logoutBtn').addEventListener('click', () => window.ElimuOs.auth.logout());
</script>

</body>
</html>
